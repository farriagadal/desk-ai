<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Desk AI: una esfera de voz sobre fondo nocturno, con la insignia de Claude como integración. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1f4d"/>
      <stop offset="0.55" stop-color="#151127"/>
      <stop offset="1" stop-color="#0b0a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#6d28d9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#b79cff"/>
      <stop offset="0.45" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="30" flood-color="#05040a" flood-opacity="0.65"/>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="232"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="492" cy="560" r="430" fill="url(#glow)"/>
    <!-- borde de luz arriba -->
    <rect x="6" y="6" width="1012" height="1012" rx="226" fill="none" stroke="url(#rim)" stroke-width="6"/>
  </g>

  <!-- esfera de voz -->
  <circle cx="492" cy="560" r="296" fill="url(#orb)" filter="url(#shadow)"/>
  <ellipse cx="492" cy="390" rx="226" ry="120" fill="url(#shine)"/>
  <g fill="#fff">
    <rect x="296" y="505" width="48" height="110" rx="24"/>
    <rect x="382" y="452" width="48" height="216" rx="24"/>
    <rect x="468" y="400" width="48" height="320" rx="24"/>
    <rect x="554" y="452" width="48" height="216" rx="24"/>
    <rect x="640" y="505" width="48" height="110" rx="24"/>
  </g>

  <!-- insignia de Claude (integración) -->
  <circle cx="800" cy="224" r="176" fill="#120e22"/>
  <circle cx="800" cy="224" r="148" fill="#d97757"/>
  <g transform="translate(800 224)" stroke="#fff" stroke-width="24" stroke-linecap="round">
    <line x1="0" y1="0" x2="0" y2="-104"/>
    <line x1="0" y1="0" x2="0" y2="-88" transform="rotate(30)"/>
    <line x1="0" y1="0" x2="0" y2="-100" transform="rotate(60)"/>
    <line x1="0" y1="0" x2="0" y2="-84" transform="rotate(90)"/>
    <line x1="0" y1="0" x2="0" y2="-104" transform="rotate(120)"/>
    <line x1="0" y1="0" x2="0" y2="-90" transform="rotate(150)"/>
    <line x1="0" y1="0" x2="0" y2="-100" transform="rotate(180)"/>
    <line x1="0" y1="0" x2="0" y2="-86" transform="rotate(210)"/>
    <line x1="0" y1="0" x2="0" y2="-104" transform="rotate(240)"/>
    <line x1="0" y1="0" x2="0" y2="-88" transform="rotate(270)"/>
    <line x1="0" y1="0" x2="0" y2="-100" transform="rotate(300)"/>
    <line x1="0" y1="0" x2="0" y2="-84" transform="rotate(330)"/>
  </g>
</svg>
