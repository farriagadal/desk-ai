<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Desk AI: ícono de la app (bandeja, ventana, favicon). Una esfera de voz grande sobre fondo nocturno. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1f4d"/>
      <stop offset="0.55" stop-color="#151127"/>
      <stop offset="1" stop-color="#0b0a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#b79cff"/>
      <stop offset="0.45" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#05040a" flood-opacity="0.6"/>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="232"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="512" cy="512" r="500" fill="url(#glow)"/>
  </g>

  <circle cx="512" cy="512" r="384" fill="url(#orb)" filter="url(#shadow)"/>
  <ellipse cx="512" cy="292" rx="292" ry="150" fill="url(#shine)"/>
  <g fill="#fff">
    <rect x="258" y="440" width="62" height="144" rx="31"/>
    <rect x="370" y="372" width="62" height="280" rx="31"/>
    <rect x="481" y="304" width="62" height="416" rx="31"/>
    <rect x="592" y="372" width="62" height="280" rx="31"/>
    <rect x="704" y="440" width="62" height="144" rx="31"/>
  </g>
</svg>
